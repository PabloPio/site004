<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - Box Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px; 
        }

        .bloco {
            width: 400px;
            height: 200px;
            margin: 20px 10px;
            padding: 30px;
            border: 4px solid #e74c3c;
            background-color: #f39c12;
            border-radius: 15px;
        }

        .linha {
            display: inline-block; 
            margin: 10px;
            padding: 5px;
            border-bottom: 2px dashed #3498db;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="bloco">
        Este é um elemento de bloco com todas as propriedades solicitadas.
    </div>

    <span class="linha">Elemento em linha 1</span>
    <span class="linha">Elemento em linha 2</span>

</body>
</html>
